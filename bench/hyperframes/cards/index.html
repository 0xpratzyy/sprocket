<script>
const cards = Array.from(document.querySelectorAll(".card"));
const blob = document.getElementById("blob");
function draw(t) {
  cards.forEach((el, i) => { el.style.transform = "rotate(" + 12 * Math.sin(t * 2 + i * 0.4) + "deg) scale(" + (0.92 + 0.08 * Math.sin(t * 3 + i * 0.7)) + ")"; });
  blob.style.transform = "translate(" + 200 * Math.sin(t * 0.8) + "px, " + 300 * Math.cos(t * 0.6) + "px)";
}
const tl = gsap.timeline({ paused: true });
const s = { t: 0 };
tl.to(s, { t: 10, duration: 10, ease: "none", onUpdate: () => draw(s.t) }, 0);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
draw(0);
tl.seek(0);
</script>
